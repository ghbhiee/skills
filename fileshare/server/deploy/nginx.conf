# Fileshare site. HTTPS on 443 (reuses the existing acme.sh/ZeroSSL cert).
# /s/ is routed through the backend so links are clean token-only URLs and so
# single .html uploads render as web apps; the backend returns X-Accel-Redirect
# and nginx serves the actual bytes from the internal /_filedata/ location.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name fileshare.example.com _;

    # ACME HTTP-01 challenge (acme.sh webroot mode)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name fileshare.example.com _;

    ssl_certificate     /home/certs/fileshare.example.com.cer;
    ssl_certificate_key /home/certs/fileshare.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 0;
    server_tokens off;

    # public share entrypoint -> backend (decides file/web, name, type, expiry)
    location /s/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # internal: nginx serves the real bytes here after X-Accel-Redirect
    location /_filedata/ {
        internal;
        alias /var/www/fileshare/data/;
    }

    # fixed, permanent, public install assets (skill bundle + installer) — no expiry
    location /install/ {
        alias /var/www/fileshare/static/;
        autoindex off;
        default_type application/octet-stream;
    }

    # authenticated uploads -> backend (streamed)
    location /upload {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /healthz { proxy_pass http://127.0.0.1:8787; }

    location = / { default_type text/plain; return 200 "fileshare ok\n"; }
}
